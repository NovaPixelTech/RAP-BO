<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>RAP Coach — Learn SAP RAP Business Objects</title>
  <meta name="description" content="A local-first trainer for SAP RAP BO: lessons, spaced repetition, quizzes, a code generator and your own examples." />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1120'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' font-family='monospace' fill='%235eead4'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="root"></div>

  <div id="palette" class="palette" hidden>
    <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Search and commands">
      <div class="palette-input-row">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M10 4a6 6 0 1 0 3.5 10.9l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
        <input id="paletteInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search lessons, examples, references…  or type > for commands" aria-controls="paletteResults" />
        <kbd>Esc</kbd>
      </div>
      <div id="paletteResults" class="palette-results" role="listbox" aria-label="Results"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>Enter</kbd> open</span>
        <span><kbd>Ctrl</kbd><kbd>K</kbd> toggle</span>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Dialog</h2>
        <button class="icon-btn" type="button" data-close-modal aria-label="Close dialog">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFoot" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- content must load before the store indexes it -->
  <script src="js/content/01-foundations.js"></script>
  <script src="js/content/02-cds.js"></script>
  <script src="js/content/03-behavior.js"></script>
  <script src="js/content/04-services.js"></script>
  <script src="js/content/05-advanced.js"></script>
  <script src="js/content/06-practice.js"></script>
  <!-- data + engine -->
  <script src="js/store.js"></script>
  <script src="js/reference.js"></script>
  <script src="js/code.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
